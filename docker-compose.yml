# Local stack: Kafka broker + rating event producer (dev).
# Config: root `.env` (infra/Kafka) + `services/producer/.env` (producer app).
# Copy from `.env.example` files before first run.

services:
  kafka:
    image: apache/kafka:3.8.1
    container_name: kafka
    env_file:
      - .env
    ports:
      - "${KAFKA_HOST_PORT}:9094"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - movierec

  producer:
    build:
      context: ./services/producer
      dockerfile: docker/Dockerfile.dev
    container_name: rating-producer
    env_file:
      - ./services/producer/.env
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./services/producer/src:/app/src:ro
      - ./datasets:/data:ro
    networks:
      - movierec

networks:
  movierec:
    driver: bridge
